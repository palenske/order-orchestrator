name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: order_orch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/order_orch_test
          REDIS_URL: redis://localhost:6379

      - run: pnpm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/order_orch_test
          REDIS_URL: redis://localhost:6379

      - run: pnpm run test

      - name: Validate Dockerfile
        run: docker build -t order-orch-ci .